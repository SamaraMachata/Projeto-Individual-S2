<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/global.css">

</head>
<body>
      <div class="box">
          <div>
            <p>Já possui cadastro? clique aqui para fazer o login</p>
           <a href="index.html"><button class="btn">CADASTRAR</button></a>    
          </div>

            <div>
                Email:<br>
                <input type="text" id="input_email"><br>
                Senha:<br>
                <input type="password" id="input_senha"><br>
                <button class="btn" onclick="ValidarLogin()">ENTRAR</button>
            </div>

      </div>

      <div id="div_mensagem"></div>
</body>
</html>
<script src="script.js">
  
       //VERIFICAÇÃO LOGIN
 function ValidarLogin(){
  let email = input_email.value
  let senha = input_senha.value
  div_mensagem.innerHTML = ""

  if (email == "" || senha == ""){
    div_mensagem.innerHTML = `<span style="color: red;"<b>Preencha todos os campos!</b></span>`
    return;
  }else if (!email.includes(`@`)){
    div_mensagem.innerHTML = `<span style="color: red;"<b>Falta @ no campo email!</b></span>`
    return;
  }else if (senha.length < 8){
    div_mensagem.innerHTML = `<span style="color: red;"<b>A Senha precisa ter 8 digitos ou mais!</b></span>`
    return;
  }
  
  TelaHome2()

 }
</script>

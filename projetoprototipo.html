    // TELA SOBRE
    function TelaSobre(){
        div_principal.innerHTML = `
        <button class="btn_voltar" onclick="TelaHome2()">VOLTAR</button>
        <br>
        <div class="box_sobrejogo">
            <h1>Sobre a História de Undertale:</h1>
            <p>
                Há muito tempo, duas raças governavam a Terra:
                <br> Humanos e Monstros. Um dia, uma guerra irrompeu entre as duas raças. 
                <br>Após uma longa batalha, os humanos saíram vitoriosos. Sete de seus maiores magos confinaram os monstros no Subsolo com uma barreira mágica . 
                <br>No entanto, essa barreira não é perfeita.<br>
<br>

Muitos anos após a guerra, em 201X, uma criança humana escala o Monte Ebott por razões misteriosas. 
<br>Dizem que aqueles que escalam a montanha jamais retornam. 
<br>A criança descobre um enorme buraco na montanha e cai dentro dele.
<br>A partir daí, a história começa.<br>

O protagonista inicia sua aventura nas Ruínas e logo encontra Flowey , uma flor sádica que tenta matá-lo por puro divertimento. 
<br>Ele é impedido por uma monstra maternal chamada Toriel , que ensina a criança a resolver enigmas e conflitos no Subsolo. 
<br>Após uma batalha épica contra ela, Toriel permite que a criança saia das Ruínas.<br>

O desenrolar da história na seção principal do jogo é determinado pelas ações do protagonista em relação aos personagens secundários e outros monstros. 
<br>O enredo, assim como grande parte dos diálogos, pode variar bastante dependendo das decisões do jogador. 
<br>Os três caminhos principais são a Rota Neutra , a Rota Pacifista Verdadeira e a Rota Genocida .<br></p>
</div> 
<br>
<div class="box_sobrepersonagem">
  <h1>Sobre cada personagem:</h1>

  <div><p>
    <h1>Frisk</h1>
    Protagonista de Undertale, Frisk é uma criança humana que cai no subsolo, um mundo habitado
    por monstros.
    <br>Ao longo da jornada, o jogador decide como Frisk interage com esse mundo:
    com violência, indiferença ou compaixão. 
    <br>Essas escolhas afetam profundamente a história
    e o destino de todos os personagens, tornando Frisk uma figura central na narrativa.
<br>
    <br><b>Curiosidade:</b><br>
    O jogo nunca define o gênero de Frisk, justamente para que qualquer jogador possa se identificar com o personagem.
  </p></div>

<br>  

  <div><p>
    <h1>Sans</h1>
    Sans é um esqueleto aparentemente preguiçoso, que gosta de piadas ruins e evita responsabilidades.<br>
    Apesar disso, ele possui um entendimento profundo do funcionamento do universo do jogo e pode se tornar
    extremamente sério e poderoso dependendo das escolhas do jogador.<br>

    <br><b>Curiosidade:</b><br>
    Sans é conhecido por ser um dos chefes mais difíceis da história dos jogos, mas só enfrenta o jogador em uma rota específica,
    e outra curiosidade é que ele ama beber ketchup.
  </p></div>

<br>  

  <div><p>
    <h1>Papyrus</h1>
    Papyrus é o irmão mais novo de Sans e sonha em se tornar membro da Guarda Real.<br>
    Ele é entusiasmado, ingênuo e extremamente determinado, sempre acreditando no melhor das pessoas, inclusive do jogador.<br>
    
    <br><b>Curiosidade:</b><br>
    Mesmo durante uma luta, Papyrus evita machucar o jogador de verdade, mostrando sua natureza bondosa.
  </p></div>

<br>  

  <div><p>
    <h1>Toriel</h1>
   Toriel é uma figura materna que cuida de Frisk no início da jornada.<br>
   Ela tenta proteger o jogador dos perigos do subsolo e ensina os primeiros conceitos do jogo.
    <br><br><b>Curiosidade:</b><br>
   O nome “Toriel” é uma mistura de “tutorial” com “riel”, fazendo referência ao papel dela no início do jogo.
  </p></div>

<br>  

   <div><p>
    <h1>Undyne</h1>
  Undyne é a líder da Guarda Real e uma guerreira extremamente determinada.<br>
  Inicialmente, ela vê o jogador como inimigo, mas dependendo das escolhas, pode se tornar uma grande aliada.
   <br><br><b>Curiosidade:</b><br>
  Na rota pacifista, Undyne revela um lado mais descontraído e até engraçado, completamente diferente da sua postura inicial.
  </p></div>

<br>  

  <div><p>
    <h1>Asgore</h1>
 Asgore é o rei dos monstros e governa o subsolo.<br> 
 Ele deseja libertar seu povo, mas suas ações carregam um grande peso emocional e moral.
    <br><br><b>Curiosidade:</b><br>
 Apesar de ser apresentado como um antagonista, Asgore é gentil e relutante, tornando-se um dos personagens mais trágicos do jogo.
  </p></div>

<br>  

  <div><p>
    <h1>Mettaton</h1>
 Mettaton é um robô criado por Alphys, com personalidade extravagante e paixão por entretenimento.<br> 
 Ele transforma encontros em verdadeiros shows, misturando combate com apresentações.
    <br><br><b>Curiosidade:</b><br>
Mettaton possui diferentes formas, incluindo uma versão mais “humana” inspirada em ídolos pop.
  </p></div>
   
<br>  

   <div><p>
    <h1>Alphys</h1>
 Alphys é a cientista real, responsável por diversas criações importantes no jogo.<br> 
 Apesar de brilhante, ela é insegura e tem dificuldade em lidar com suas próprias decisões.
    <br><br><b>Curiosidade:</b><br>
Alphys faz diversas referências a animes e cultura geek, refletindo sua personalidade tímida e apaixonada por ficção.
  </p></div>

<br>  

   <div><p>
    <h1>Flowey</h1>
Flowey é uma flor que inicialmente parece amigável, mas rapidamente revela uma natureza manipuladora e perigosa.<br>
Ele entende as mecânicas do jogo e tenta influenciar o jogador.
    <br><br><b>Curiosidade:</b><br>
Flowey quebra a “quarta parede”, interagindo diretamente com o jogador e não apenas com o personagem.
  </p></div>

<br>  

  <div><p>
    <h1>Asriel</h1>
Asriel Dreemurr é o filho de Asgore e Toriel, com um papel central na história do jogo.<br> 
Sua trajetória está diretamente ligada aos eventos mais importantes do enredo.
    <br><br><b>Curiosidade:</b><br>
O nome Asriel é um anagrama de “serial” e também lembra figuras mitológicas associadas à morte, e também é a junção dos nomes Toriel e Asgore.
  </p></div>

<br>  

   <div><p>
    <h1>Napstablook</h1>
Napstablook é um fantasma introvertido e melancólico que prefere ficar sozinho ouvindo música.<br>
Apesar disso, ele demonstra sensibilidade e criatividade.
    <br><br><b>Curiosidade:</b><br>
Ele compõe suas próprias músicas dentro do jogo, e o jogador pode ouvi-las interagindo com ele.
  </p></div>

<br>  

   <div><p>
    <h1>Temmie</h1>
Temmie é uma criatura caótica e engraçada, conhecida por sua forma peculiar de falar e comportamento imprevisível.
        <br><br><b>Curiosidade:</b><br>
Temmie foi inspirada na artista Temmie Chang, que trabalhou no desenvolvimento do jogo.
  </p></div>

<br>  

   <div><p>
    <h1>Mad Mew Mew</h1>
Mad Mew Mew é uma forma alternativa de um personagem fantasma que possui uma personalidade intensa e explosiva, aparecendo em versões específicas do jogo.
      <br><br><b>Curiosidade:</b><br>
Esse personagem só aparece em algumas plataformas, como a versão de console, sendo desconhecido por muitos jogadores.
  </p></div>

<br>  

  <div><p>
    <h1>Muffet</h1>
Muffet é uma aranha que administra uma confeitaria e luta para proteger sua espécie.<br> 
Ela combina aparência fofa com um estilo de combate desafiador.
    <br><br><b>Curiosidade:</b><br>
Muffet foi originalmente criada por um fã durante uma campanha de apoio ao jogo e acabou sendo incluída oficialmente.
  </p></div>

</div>

`
    }

    //VERIFICAÇÃO LOGIN
 function ValidarLogin(){
  let email = input_email.value
  let senha = input_senha.value
  div_mensagem.innerHTML = ""

  if (email == "" || senha == ""){
    div_mensagem.innerHTML = `<span style="color: red;"<b>Preencha todos os campos!</b></span>`
    return;
  }else if (!email.includes(`@`)){
    div_mensagem.innerHTML = `<span style="color: red;"<b>Falta @ no campo email!</b></span>`
    return;
  }else if (senha.length < 8){
    div_mensagem.innerHTML = `<span style="color: red;"<b>A Senha precisa ter 8 digitos ou mais!</b></span>`
    return;
  }
  
  TelaHome2()

 }

 //VERIFICAÇÃO CADASTRO
 function ValidarCadastro(){
 let email = input_emailCadastro.value
 let senha = input_senhaCadastro.value
 let numero = input_numero.value
  div_mensagem.innerHTML = ""

  if (email == "" || senha == ""){
    div_mensagem.innerHTML = `<span style="color: red;"<b>Preencha todos os campos!</b></span>`
    return;
  }else if (!email.includes(`@`)){
    div_mensagem.innerHTML = `<span style="color: red;"<b>Falta @ no campo email!</b></span>`
    return;
  }else if (senha.length < 8){
    div_mensagem.innerHTML = `<span style="color: red;"<b>A Senha precisa ter 8 digitos ou mais!</b></span>`
    return;
  }else if (numero < 8 ){
     div_mensagem.innerHTML = `<span style="color: red;"<b>Número Inválido!</b></span>`
    return;
  }
  
  TelaHome2()

 }
